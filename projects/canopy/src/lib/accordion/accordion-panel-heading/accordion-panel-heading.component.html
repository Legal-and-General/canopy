<lg-heading [level]="headingLevel" class="lg-accordion__heading">
  <button
    type="button"
    [id]="_toggleId"
    class="lg-accordion__heading-toggle"
    [class.lg-accordion__heading-toggle--active]="_isActive"
    [class.lg-accordion__heading-toggle--with-icon]="!!decorativeIcon"
    [attr.aria-expanded]="_isActive"
    [attr.aria-controls]="_panelId"
    (click)="toggle()">
    <lg-icon
      class="lg-accordion__heading-icon lg-accordion__heading-icon--animated"
      name="chevron-down" />
    <ng-content select="lg-icon" />
    <span class="lg-accordion__heading-toggle-label">
      <ng-content />
    </span>
  </button>
</lg-heading>
<ng-content select="[lgAccordionHeadingActions]" />
